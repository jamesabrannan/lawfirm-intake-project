spring.application.name=legal-research

# Spring Boot's default console appender writes to standard out. Setting this
# filename adds a rolling file appender without replacing console output.
logging.file.name=logs/researchmemorandum.log
logging.level.root=INFO
logging.level.com.demo.legalfirm=TRACE
# The summarizer itself is quiet to avoid doubling every method log entry.
logging.level.com.demo.legalfirm.logging.LogSummary=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=70MB

# Demo: create a fresh database in memory from schema.sql and data.sql on startup.
# No preliminary or persistent .db file is read or written.
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
# SQLite :memory: belongs to one physical connection. Keep that connection alive
# for the demo's application lifetime and reuse it for all JDBC operations.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.idle-timeout=0
spring.sql.init.mode=always
spring.ai.openai.api-key=${OPENAI_API_KEY}
